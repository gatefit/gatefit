name: prisma-starter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install the gatefit checkout
        run: npm ci
      - name: Run the Prisma starter example
        run: bash examples/prisma-starter/ci.sh
