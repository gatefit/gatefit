name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  # withastro/action uploads a build artifact. The last green build used this
  # permission for that upload. This workflow does not deploy.
  pages: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v6
        with:
          path: site
          node-version: 22
        env:
          # Empty / unset uses the committed Checkout Link. Any other non-polar_cl_ value fails closed.
          PUBLIC_POLAR_CHECKOUT_URL: ${{ vars.PUBLIC_POLAR_CHECKOUT_URL }}
