name: gatefit
description: "Compatibility shim — prefer uses: gatefit/gatefit@v0.5.2 (repo-root action.yml)"
inputs:
  adapter:
    description: Path to the AccessAdapter module, relative to the caller workspace
    required: true
  suite:
    description: Golden file, directory, or id. Defaults to the bundled goldens (S1–S9 and Phase 2 fixtures)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Run gatefit
      shell: bash
      env:
        GATEFIT_ADAPTER_INPUT: ${{ inputs.adapter }}
        GATEFIT_SUITE_INPUT: ${{ inputs.suite }}
      run: |
        set -euo pipefail
        GATEFIT_ROOT="$(cd "${GITHUB_ACTION_PATH}/../../.." && pwd)"
        bash "${GATEFIT_ROOT}/scripts/action-run.sh"
