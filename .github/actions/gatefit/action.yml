name: gatefit
description: Run Gatefit entitlement goldens against an AccessAdapter
inputs:
  adapter:
    description: Path to the AccessAdapter module, relative to the caller workspace
    required: true
  suite:
    description: Golden file, directory, or id. Defaults to bundled S1–S6 goldens
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Run gatefit
      shell: bash
      env:
        GATEFIT_ADAPTER_INPUT: ${{ inputs.adapter }}
        GATEFIT_SUITE_INPUT: ${{ inputs.suite }}
      run: |
        set -euo pipefail
        GATEFIT_ROOT="$(cd "${GITHUB_ACTION_PATH}/../../.." && pwd)"
        ADAPTER="$(cd "${GITHUB_WORKSPACE}" && realpath "${GATEFIT_ADAPTER_INPUT}")"
        if [[ -n "${GATEFIT_SUITE_INPUT}" && -e "${GITHUB_WORKSPACE}/${GATEFIT_SUITE_INPUT}" ]]; then
          SUITE="$(cd "${GITHUB_WORKSPACE}" && realpath "${GATEFIT_SUITE_INPUT}")"
        elif [[ -n "${GATEFIT_SUITE_INPUT}" ]]; then
          SUITE="${GATEFIT_SUITE_INPUT}"
        else
          SUITE="${GATEFIT_ROOT}/tests/entitlements/goldens"
        fi
        cd "${GATEFIT_ROOT}"
        npm install --ignore-scripts
        npx tsx src/cli.ts run --suite "${SUITE}" --adapter "${ADAPTER}"
