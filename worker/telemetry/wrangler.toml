# GATEFIT-H25 telemetry collector. Deployed by hand (see README.md); not part of CI
# and not in the npm tarball. No credentials live here.
name = "gatefit-telemetry"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [
  { pattern = "t.gatefit.io", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "gatefit-telemetry"
# D1 database id (created 2026-11-02 with `npx wrangler@4 d1 create gatefit-telemetry`). Public identifier only.
database_id = "3d2616af-80d5-4e6d-adfa-db735d730262"
migrations_dir = "migrations"
