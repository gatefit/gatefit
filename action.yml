name: Gatefit
description: Run Gatefit entitlement goldens against an AccessAdapter (access DB, not Stripe HTTP 200)
author: gatefit
branding:
  icon: shield
  color: green
inputs:
  adapter:
    description: Path to the AccessAdapter module, relative to the caller workspace
    required: true
  suite:
    description: Golden file, directory, or id. Defaults to the bundled goldens (S1–S9 and Phase 2 fixtures)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Run gatefit
      shell: bash
      env:
        GATEFIT_ADAPTER_INPUT: ${{ inputs.adapter }}
        GATEFIT_SUITE_INPUT: ${{ inputs.suite }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/action-run.sh"
