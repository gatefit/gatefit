# P9. Polar past_due denies until recovery.
# POLAR_SCHEMA v1@2026-11-01 (src/polar-pack.ts). Polar public v1 webhook event names.
# Event id is the Standard Webhooks webhook-id. Polar types carry no Stripe shortcut flags.
# subscription.updated with status past_due locks, even with HTTP 200. subscription.active reopens.
# HTTP 200 is not access. Paid Polar provider pack; runs only with a Gatefit Indie License.
id: polar_past_due_denies_until_recovery
subject: cus_polar_p9
steps:
  - event:
      id: wh_p9_active
      type: subscription.active
      customerId: cus_polar_p9
      status: active
      plan: pro
    expect:
      locked: false
      plan: pro
  - event:
      id: wh_p9_past_due
      type: subscription.updated
      customerId: cus_polar_p9
      status: past_due
      httpStatus: 200
    expect:
      locked: true
      plan: pro
  - event:
      id: wh_p9_recovered
      type: subscription.active
      customerId: cus_polar_p9
      status: active
      plan: pro
    expect:
      locked: false
      plan: pro
