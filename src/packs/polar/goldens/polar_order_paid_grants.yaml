# P1. Polar order.paid grants access.
# POLAR_SCHEMA v1@2026-11-01 (src/polar-pack.ts). Polar public v1 webhook event names.
# Event id is the Standard Webhooks webhook-id. Polar types carry no Stripe shortcut flags.
# A checkout and a pending order with HTTP 200 stay locked. Only order.paid opens the row.
# HTTP 200 is not access. Paid Polar provider pack; runs only with a Gatefit Indie License.
id: polar_order_paid_grants
subject: cus_polar_p1
steps:
  - event:
      id: wh_p1_checkout_created
      type: checkout.created
      customerId: cus_polar_p1
      status: open
      httpStatus: 200
    expect:
      locked: true
  - event:
      id: wh_p1_order_created
      type: order.created
      customerId: cus_polar_p1
      status: pending
      httpStatus: 200
    expect:
      locked: true
  - event:
      id: wh_p1_order_paid
      type: order.paid
      customerId: cus_polar_p1
      status: paid
      plan: pro
    expect:
      locked: false
      plan: pro
